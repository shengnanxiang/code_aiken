<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- Background -->
  <rect width="1200" height="900" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000">LEFT</text>
  
  <!-- Main body outline (left view: height=70mm, depth=51mm) -->
  <!-- 70*8=560, 51*8=408 -->
  <!-- Centered: x=(1200-408)/2=396, y=(900-560)/2=170 -->
  <rect x="396" y="170" width="408" height="560" rx="24" ry="24"
        fill="none" stroke="#000000" stroke-width="3"/>
  
  <!-- Top edge (thinner) -->
  <line x1="396" y1="170" x2="804" y2="170" stroke="#000000" stroke-width="2"/>
  
  <!-- Bottom edge -->
  <line x1="396" y1="730" x2="804" y2="730" stroke="#000000" stroke-width="2"/>
  
  <!-- Front face (left side of view) -->
  <line x1="396" y1="170" x2="396" y2="730" stroke="#000000" stroke-width="2"/>
  
  <!-- Back face (right side of view) -->
  <line x1="804" y1="170" x2="804" y2="730" stroke="#000000" stroke-width="2"/>
  
  <!-- Lens protrusion (left side) -->
  <!-- Lens extends ~8mm from body -->
  <rect x="340" y="420" width="56" height="120" rx="8" ry="8"
        fill="none" stroke="#000000" stroke-width="2"/>
  <!-- Lens front -->
  <line x1="340" y1="420" x2="340" y2="540" stroke="#000000" stroke-width="2"/>
  
  <!-- Flash housing (top, visible from left) -->
  <rect x="700" y="150" width="80" height="40" rx="4" ry="4"
        fill="none" stroke="#000000" stroke-width="2"/>
  
  <!-- Strap lug -->
  <rect x="380" y="400" width="16" height="24" rx="4" ry="4"
        fill="none" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Center lines -->
  <line x1="396" y1="450" x2="804" y2="450" stroke="#999999" stroke-width="0.5" stroke-dasharray="8,4"/>
  <line x1="600" y1="170" x2="600" y2="730" stroke="#999999" stroke-width="0.5" stroke-dasharray="8,4"/>
  
</svg>
