<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- Background -->
  <rect width="1200" height="900" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000">RIGHT</text>
  
  <!-- Main body outline (right view: height=70mm, depth=51mm) -->
  <rect x="396" y="170" width="408" height="560" rx="24" ry="24"
        fill="none" stroke="#000000" stroke-width="3"/>
  
  <!-- Top edge -->
  <line x1="396" y1="170" x2="804" y2="170" stroke="#000000" stroke-width="2"/>
  
  <!-- Bottom edge -->
  <line x1="396" y1="730" x2="804" y2="730" stroke="#000000" stroke-width="2"/>
  
  <!-- Front face (right side of view) -->
  <line x1="804" y1="170" x2="804" y2="730" stroke="#000000" stroke-width="2"/>
  
  <!-- Back face (left side of view) -->
  <line x1="396" y1="170" x2="396" y2="730" stroke="#000000" stroke-width="2"/>
  
  <!-- Grip area (enhanced, right side) -->
  <!-- Grip is more pronounced on right side -->
  <rect x="740" y="220" width="64" height="480" rx="12" ry="12"
        fill="none" stroke="#000000" stroke-width="1.5"/>
  <!-- Grip texture -->
  <line x1="760" y1="240" x2="760" y2="680" stroke="#000000" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="780" y1="240" x2="780" y2="680" stroke="#000000" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="800" y1="240" x2="800" y2="680" stroke="#000000" stroke-width="0.5" stroke-dasharray="3,3"/>
  
  <!-- Grip finger groove (subtle indentation) -->
  <path d="M 740 350 Q 720 380 740 410" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 740 450 Q 720 480 740 510" fill="none" stroke="#000000" stroke-width="1"/>
  <path d="M 740 550 Q 720 580 740 610" fill="none" stroke="#000000" stroke-width="1"/>
  
  <!-- Lens protrusion (right side) -->
  <rect x="804" y="420" width="56" height="120" rx="8" ry="8"
        fill="none" stroke="#000000" stroke-width="2"/>
  <!-- Lens front -->
  <line x1="860" y1="420" x2="860" y2="540" stroke="#000000" stroke-width="2"/>
  
  <!-- Flash housing (top, visible from right) -->
  <rect x="500" y="150" width="80" height="40" rx="4" ry="4"
        fill="none" stroke="#000000" stroke-width="2"/>
  
  <!-- Strap lug -->
  <rect x="804" y="400" width="16" height="24" rx="4" ry="4"
        fill="none" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Center lines -->
  <line x1="396" y1="450" x2="804" y2="450" stroke="#999999" stroke-width="0.5" stroke-dasharray="8,4"/>
  <line x1="600" y1="170" x2="600" y2="730" stroke="#999999" stroke-width="0.5" stroke-dasharray="8,4"/>
  
</svg>
